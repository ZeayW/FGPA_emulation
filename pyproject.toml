[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "emuflow"
version = "0.1.0"
description = "Open multi-FPGA emulation flow targeting AMD UltraScale+"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
  {name = "EmuFlow contributors"}
]
dependencies = []

[project.scripts]
emuflow = "emuflow.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
